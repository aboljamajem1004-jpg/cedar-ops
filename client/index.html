<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e13" />
    <title>Cedar Ops</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
        color: #e6e9ef;
        font-family: system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #debug-overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.62);
        color: #9ef5b0;
        font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #debug-overlay[hidden] {
        display: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #0b0e13;
        color: #e6e9ef;
        text-align: center;
        transition: opacity 0.3s ease;
      }
      #loading[hidden] {
        display: none;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .loading-title {
        font: 600 22px/1 system-ui, sans-serif;
        letter-spacing: 4px;
        color: #9ef5b0;
      }
      .loading-status {
        font: 13px/1.4 ui-monospace, monospace;
        color: #8a93a3;
        min-height: 1.4em;
      }
      .loading-bar {
        width: min(280px, 70vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .loading-fill {
        height: 100%;
        width: 0%;
        background: #9ef5b0;
        transition: width 0.25s ease;
      }
      .loading-error {
        max-width: min(560px, 90vw);
        padding: 12px 14px;
        border: 1px solid rgba(255, 128, 112, 0.5);
        border-radius: 6px;
        background: rgba(120, 30, 24, 0.35);
        color: #ffb4a2;
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        text-align: left;
        user-select: text;
      }
      .loading-error[hidden] {
        display: none;
      }
      /* Touch-only toggle. Top-right stays clear of the fire and jump buttons
         that land bottom-right in phase 7. */
      #debug-toggle,
      #quality-toggle {
        position: fixed;
        z-index: 11;
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border: 1px solid rgba(158, 245, 176, 0.4);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #9ef5b0;
        font: 11px/1 ui-monospace, monospace;
        letter-spacing: 0.5px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #quality-toggle {
        top: calc(58px + env(safe-area-inset-top));
      }
      #debug-toggle:active,
      #quality-toggle:active {
        background: rgba(158, 245, 176, 0.25);
      }
      #quality-toggle[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- Static markup so something is on screen before any JavaScript parses.
         On a phone over a slow connection the assets take seconds, and a black
         screen with no feedback reads as a broken page. -->
    <div id="loading">
      <div class="loading-title">CEDAR OPS</div>
      <div class="loading-status" id="loading-status">starting…</div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-error" id="loading-error" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
