<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e13" />
    <title>Cedar Ops</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
        color: #e6e9ef;
        font-family: system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #debug-overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.62);
        color: #9ef5b0;
        font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #debug-overlay[hidden] {
        display: none;
      }
      /* Touch-only toggle. Top-right stays clear of the fire and jump buttons
         that land bottom-right in phase 7. */
      #debug-toggle,
      #quality-toggle {
        position: fixed;
        z-index: 11;
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border: 1px solid rgba(158, 245, 176, 0.4);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #9ef5b0;
        font: 11px/1 ui-monospace, monospace;
        letter-spacing: 0.5px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #quality-toggle {
        top: calc(58px + env(safe-area-inset-top));
      }
      #debug-toggle:active,
      #quality-toggle:active {
        background: rgba(158, 245, 176, 0.25);
      }
      #quality-toggle[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
