# FALLBACK DEPLOY — not the primary target.
#
# The client is deployed by Cloudflare Pages, which builds from this repo on
# every push (see README.md). This workflow is kept as a working, documented
# alternative in case Cloudflare is unavailable.
#
# It is manual-trigger only (Actions tab -> Run workflow). It deliberately does
# NOT run on push, so it can never race the Cloudflare deploy or publish a
# second copy of the site without someone asking for it.
#
# Prerequisites: repo Settings -> Pages -> Source: GitHub Actions, and an
# account with GitHub Actions enabled.

name: Deploy client to GitHub Pages (fallback)

on:
  workflow_dispatch:

# Required by actions/deploy-pages: read the repo, write the Pages site, and
# mint the OIDC token the deploy action authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a running deploy — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # GitHub Pages serves this repo from a subpath, not the domain root, so
      # every asset URL needs the prefix. Cloudflare needs no equivalent.
      - run: npm run build
        env:
          CEDAR_BASE: /cedar-ops/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
